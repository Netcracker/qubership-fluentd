---
name: Build Artifacts
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  release:
    types: [created]
  push:
    branches:
    - '**'
    paths-ignore:
    - '.github/**'
    - 'docs/**'
    - 'CODE-OF-CONDUCT.md'
    - 'CONTRIBUTING.md'
    - 'LICENSE'
    - 'README.md'
    - 'SECURITY.md'
  pull_request:
    branches:
    - '**'

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Detect Fluentd image changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Match changed files against Fluentd image paths
      id: filter
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        changed="$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")"
        echo "Changed files:"
        printf '%s\n' "${changed}"

        run=false
        if [[ -z "${changed}" ]]; then
          run=true
        else
          while IFS= read -r file; do
            case "${file}" in
              .github/workflows/build.yaml|ci/*)
                run=true
                break
                ;;
              .github/*|docs/*|CODE-OF-CONDUCT.md|CONTRIBUTING.md|LICENSE|README.md|SECURITY.md)
                ;;
              *)
                run=true
                break
                ;;
            esac
          done <<< "${changed}"
        fi
        echo "run=${run}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate Fluentd bundle
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build amd64 image for verification
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        no-cache: true
        context: .
        file: Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        provenance: false
        tags: ci-fluentd:pr
    - name: Verify gems, smoke config, and entrypoint
      run: |
        set -euo pipefail
        docker run --rm \
          -v "${PWD}/ci/fluentd-smoke.conf:/fluentd/etc/smoke.conf:ro" \
          -v "${PWD}/ci/verify-fluentd-image.sh:/tmp/verify-fluentd-image.sh:ro" \
          ci-fluentd:pr \
          /bin/sh /tmp/verify-fluentd-image.sh

  multiplatform_build:
    name: Build Fluentd image
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/qubership-fluentd
        tags: |
          type=ref,event=branch
          type=ref,event=tag
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build multiplatform image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        no-cache: true
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: false
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  multiplatform_publish:
    if: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: qubership-fluentd
          file: Dockerfile
          context: .
    runs-on: ubuntu-latest
    name: Publish ${{ matrix.component.name }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  fluentd-gate:
    name: Fluentd CI Gate
    needs: [changes, validate]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Require Fluentd validation when applicable
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.run != 'false' && needs.validate.result != 'success')
      run: exit 1

  build-gate:
    name: Build Gate
    needs: [changes, multiplatform_build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Require image build when applicable
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.run != 'false' && needs.multiplatform_build.result != 'success')
      run: exit 1
